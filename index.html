<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Game – 29 Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#14463c;
  --felt-deep:#0f372f;
  --panel:#0b2b25;
  --chalk:#ede6d3;
  --chalk-dim:#a9b9ad;
  --ink:#1a1b22;
  --red:#b02a30;
  --ivory:#f7f1e1;
  --ivory-edge:#d9cfb4;
  --brass:#d8a64a;
  --brass-ink:#2a1d05;
  --line:rgba(237,230,211,.2);
  --good:#9fd9a6;
  --bad:#f0a29b;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#0e2e28; --felt-deep:#0a231f; --panel:#06191a; --chalk:#e4ddc9; --chalk-dim:#8fa396;
    --ivory:#efe8d6; --ivory-edge:#cfc5aa; --red:#c2353b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --felt:#0e2e28; --felt-deep:#0a231f; --panel:#06191a; --chalk:#e4ddc9; --chalk-dim:#8fa396;
  --ivory:#efe8d6; --ivory-edge:#cfc5aa; --red:#c2353b;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--felt);
  color:var(--chalk);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#app{
  height:100%;
  max-width:480px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 70% at 50% 38%, var(--felt) 0%, var(--felt-deep) 100%);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card.legal:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* header */
#top{
  display:grid;
  grid-template-columns:54px 1fr 54px 34px 34px;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
}
.score{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.score.them{align-items:flex-end}
.score .lbl{font-size:12px;color:var(--chalk-dim);margin-bottom:3px}
.score b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#bidInfo{text-align:center;font-size:13px;line-height:1.25;color:var(--chalk-dim);min-height:32px;display:flex;flex-direction:column;justify-content:center}
#bidInfo strong{color:var(--chalk);font-weight:600;font-size:14px}
#rulesBtn,#langBtn{
  width:32px;height:32px;border-radius:50%;
  border:1.5px solid var(--line);background:transparent;font-weight:600;
}

/* table */
#table{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:68px 1fr 68px;
  grid-template-rows:auto 1fr;
  padding:8px 6px 0;
}
.seat{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.seat.n{grid-column:1/4;grid-row:1;justify-self:center;flex-direction:row;gap:10px}
.seat.w{grid-column:1;grid-row:2;align-self:center}
.seat.e{grid-column:3;grid-row:2;align-self:center}
.seat .name{
  padding:3px 9px;border-radius:99px;border:1.5px solid transparent;
  color:var(--chalk-dim);white-space:nowrap;
}
.seat.active .name{border-color:var(--brass);color:var(--chalk);background:rgba(216,166,74,.14)}
.seat .name i{font-style:normal;color:var(--brass);margin-left:4px;font-weight:800}
.backs{
  min-width:36px;height:50px;border-radius:6px;
  background:
    repeating-linear-gradient(45deg,rgba(237,230,211,.18) 0 3px,transparent 3px 6px),
    var(--panel);
  border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:var(--chalk);
  font-variant-numeric:tabular-nums;
}
.seat.n .backs{height:36px;min-width:50px}

#trick{
  grid-column:2;grid-row:2;
  position:relative;
  align-self:center;
  width:100%;
  max-width:260px;
  height:min(100%,200px);
  min-height:170px;
  justify-self:center;
  --cs:14px;
}
#trick::before{
  content:"";position:absolute;inset:14% 14%;
  border:1.5px dashed var(--line);border-radius:50%;
}
.slot{position:absolute;width:3.2em;height:4.5em;font-size:var(--cs)}
.slot.s{bottom:0;left:50%;transform:translateX(-50%)}
.slot.n{top:0;left:50%;transform:translateX(-50%)}
.slot.w{left:2px;top:50%;transform:translateY(-50%)}
.slot.e{right:2px;top:50%;transform:translateY(-50%)}
.slot .card{animation:drop .22s ease-out}
.slot .card.win{outline:3px solid var(--brass);outline-offset:2px}
@keyframes drop{from{transform:translateY(-10px) scale(1.12);opacity:.2}to{transform:none;opacity:1}}

/* cards */
.card{
  position:relative;
  width:3.2em;height:4.5em;font-size:inherit;
  background:linear-gradient(160deg,#fffdf6 0%,var(--ivory) 60%,#efe6cf 100%);
  border:1px solid var(--ivory-edge);
  border-radius:.4em;
  color:var(--ink);
  user-select:none;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.4);
  font-family:Georgia,'Times New Roman',serif;
}
.slot .card{font-size:inherit}
.card.red{color:var(--red)}
.card .idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95}
.card .idx b{font-size:.95em;font-weight:700}
.card .idx i{font-style:normal;font-size:.8em}
.card .idx.ten b{font-size:.82em;letter-spacing:-.1em}
.card .idx.tl{top:.22em;left:.2em}
.card .idx.br{bottom:.22em;right:.2em;transform:rotate(180deg)}
.card .face{position:absolute;left:.8em;right:.8em;top:.3em;bottom:.3em}
.card .pip{position:absolute;font-size:.76em;line-height:1;transform:translate(-50%,-50%)}
.card .pip.flip{transform:translate(-50%,-50%) rotate(180deg)}
.card .pip.ace{font-size:2em}
.card .court{
  position:absolute;inset:.1em 0;
  border:1px solid currentColor;border-radius:.2em;
  display:flex;align-items:center;justify-content:center;
  background:rgba(128,128,128,.12);
  background:color-mix(in srgb,currentColor 9%,transparent);
}
.card .court b{font-size:1.9em;font-weight:700;line-height:1}
.card .court i{position:absolute;font-style:normal;font-size:.62em;line-height:1}
.card .court i.a{top:.12em;left:.15em}
.card .court i.z{bottom:.12em;right:.15em;transform:rotate(180deg)}

/* tally + dock */
#tally{
  display:flex;justify-content:center;gap:18px;
  font-size:13px;color:var(--chalk-dim);
  padding:4px 10px;min-height:26px;
}
#tally b{color:var(--chalk);font-variant-numeric:tabular-nums}
#dock{
  min-height:92px;
  padding:6px 12px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--panel);
  border-top:1px solid var(--line);
}
#msg{font-size:14px;text-align:center;min-height:20px;line-height:1.3}
#msg.alert{color:var(--brass);font-weight:600}
#acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{
  min-height:44px;padding:0 14px;border-radius:10px;
  border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:15px;
}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.suit{font-size:26px;min-width:56px;padding:0 10px;background:var(--ivory);border-color:var(--ivory-edge);color:var(--ink)}
.btn.suit.red{color:var(--red)}

/* hand */
#hand{
  padding:10px 6px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--panel);
  --cs:16px;
}
.hrow{display:flex;justify-content:center;font-size:var(--cs)}
.hrow .card{margin-left:-.75em;transition:transform .12s}
.hrow .card:first-child{margin-left:0}
.hrow .card.legal{cursor:pointer;transform:translateY(-4px)}
.hrow .card.legal:active{transform:translateY(-12px)}
.hrow .card.dim{filter:brightness(.55) saturate(.7)}

/* overlay + dialog */
#overlay{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,16,14,.78);padding:20px;
}
#overlay[hidden]{display:none}
.sheet{
  width:100%;max-width:380px;
  background:var(--panel);border:1.5px solid var(--line);border-radius:16px;
  padding:20px;
}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:800;line-height:1.2}
.sheet p{margin:0 0 10px;line-height:1.45;color:var(--chalk-dim);font-size:15px}
.sheet table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:15px}
.sheet th,.sheet td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}
.sheet th{color:var(--chalk-dim);font-weight:400;font-size:13px}
.sheet td.num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.sheet .btn{width:100%}
dialog{
  background:var(--panel);color:var(--chalk);
  border:1.5px solid var(--line);border-radius:16px;
  max-width:400px;width:calc(100% - 32px);padding:20px;
  max-height:86vh;overflow:auto;
}
dialog::backdrop{background:rgba(4,16,14,.7)}
dialog h2{margin:0 0 10px;font-size:20px}
dialog ul{margin:0 0 14px;padding-left:18px;line-height:1.5;font-size:14.5px;color:var(--chalk-dim)}
dialog li{margin-bottom:4px}
dialog b{color:var(--chalk)}
@media (prefers-reduced-motion: reduce){
  .slot .card{animation:none}
  .hrow .card{transition:none}
}
@media (max-height:640px){
  #trick{min-height:150px}
  #hand{--cs:14px}
  #dock{min-height:84px}
}
#langBtn{font-size:11px;letter-spacing:.02em}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="score us"><span class="lbl" id="lblUs">Amra</span><b id="sUs">0</b></div>
    <div id="bidInfo"></div>
    <div class="score them"><span class="lbl" id="lblThem">Tara</span><b id="sThem">0</b></div>
    <button id="langBtn" type="button" aria-label="Language">EN</button>
    <button id="rulesBtn" type="button" aria-label="Rules">?</button>
  </header>

  <main id="table">
    <div class="seat n" id="seat2"><span class="name">Partner</span><div class="backs" id="backs2">5</div></div>
    <div class="seat w" id="seat1"><span class="name">Opp A</span><div class="backs" id="backs1">5</div></div>
    <div id="trick">
      <div class="slot n" id="slot2"></div>
      <div class="slot w" id="slot1"></div>
      <div class="slot e" id="slot3"></div>
      <div class="slot s" id="slot0"></div>
    </div>
    <div class="seat e" id="seat3"><span class="name">Opp B</span><div class="backs" id="backs3">5</div></div>
  </main>

  <div id="tally"></div>

  <div id="dock">
    <div id="msg"></div>
    <div id="acts"></div>
  </div>

  <div id="hand" aria-label="Tomar card"></div>
</div>

<div id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<dialog id="rules">
  <h2 id="rulesTitle">Rules</h2>
  <ul id="rulesList"></ul>
  <button class="btn primary" id="rulesClose" style="width:100%">OK</button>
</dialog>

<script>
(function(){
'use strict';

var SUITS=['S','H','C','D'];
var SYM={S:'\u2660\uFE0E',H:'\u2665\uFE0E',C:'\u2663\uFE0E',D:'\u2666\uFE0E'};
var SUITNAME={S:'Spades',H:'Hearts',C:'Clubs',D:'Diamonds'};
var RANKL={14:'A',13:'K',12:'Q',11:'J'};
var TARGET_SCORE=29;
var LANG='bn';
try{var _sv=localStorage.getItem('callgame-lang');if(_sv==='en'||_sv==='bn')LANG=_sv}catch(e){}
var NAMES=['','Opp A','Partner','Opp B'];
var BIDNAME={};
var T={
  bn:{
    you:'Tumi',us:'Amra',them:'Tara',we:'Amra',they:'Tara',
    small:'Choto call',big:'Boro call',bonus:'Bonus call',
    rulesAria:'Rules dekho',handAria:'Tomar card',langAria:'Language bodlao',
    rulesTitle:'Rules',rulesClose:'Thik ache',
    rulesHtml:`<li>4 jon, 2 jon 2 jon team. <b>Tumi + Partner (uporer jon)</b> vs duijon Opponent.</li>
    <li>Prothome 5 ta card dekhe call hoy. Call: <b>No call</b>, <b>Choto 7</b>, <b>Boro 8</b>, <b>Bonus 10</b>.</li>
    <li>Dealer er right side theke shuru, ghorar kata ulto dike. Porer jon ke aro boro call dite hobe.</li>
    <li>Sobai no call dile card abar deal hoy.</li>
    <li>Sobcheye boro call jar, se <b>power (trump) suit</b> thik kore. Tarpor baki card deya hoy, prottek e 13 ta.</li>
    <li>Lead suit follow korte hobe. Na thakle je kono card ba power card felte paro.</li>
    <li>Lead suit er boro card jitey, kintu power card porle power card jitey. Ace sobcheye boro.</li>
    <li>Call kora team target (7/8/10) pit uthale <b>+target</b>, na uthale <b>-target</b>.</li>
    <li>Opposition er target sobsomoy <b>4 pit</b>: uthale +4, na uthale -4.</li>
    <li>Prothome <b>29 point</b> e pouchle game jita.</li>`,
    first:function(){return TARGET_SCORE+' point e jita'},
    trump:'Power',
    bidBy:function(t,b){return t+' '+b+' call'},
    saidBid:function(s){return NAMES[s]+' dilo'},
    bidding:'Call chole',
    tricksUs:'Amra pit',tricksThem:'Tara pit',
    yourBid:'Tomar call. 5 ta card dekhe bachho.',
    thinking:function(s){return NAMES[s]+' bhabche...'},
    bidSaid:function(s,v){return NAMES[s]+': '+(v?(BIDNAME[v]+' '+v):'No call')},
    allPass:'Sobai no call. Card abar deal hocche...',
    youBid:function(b){return 'Tumi '+b+' call dile. Power suit bachho.'},
    asTrump:function(n){return n+' power koro'},
    botBid:function(s,b,t){return NAMES[s]+' '+b+' call dilo. Power '+SYM[t]},
    restDealt:function(t){return 'Power '+SYM[t]+'. Baki card deya hoyeche.'},
    yourTurn:function(l){return 'Tomar turn. Lead suit '+SYM[l]},
    yourLead:'Tomar lead. Ekta card felo.',
    playing:function(s){return NAMES[s]+' khelche...'},
    wonTrick:function(s){return NAMES[s]+' pit jitlo'},
    weWon:'Amra jitlam!',
    weWonSub:function(n){return 'Tumi ar partner prothome '+n+' point e pouchle.'},
    theyWon:'Tara jitlo',
    theyWonSub:function(n){return 'Opponent ra prothome '+n+' point e pouchlo.'},
    madeBid:function(t){return t+' call uthalo'},
    missedBid:function(t){return t+' call uthate parlo na'},
    bidSub:function(t,b,k){return t+' '+b+' call dilo, '+k+' pit uthalo.'},
    th1:'Pit',th2:'Ei deal',th3:'Mot',
    newGame:'Notun game',nextDeal:'Porer deal',
    intro:function(n){return 'Tumi ar partner (uporer jon) ek team. Duijon opponent. Prothome '+n+' point e pouchle jita.'},
    start:'Khela shuru koro'
  },
  en:{
    you:'You',us:'Us',them:'Them',we:'We',they:'They',
    small:'Small call',big:'Big call',bonus:'Bonus call',
    rulesAria:'Show rules',handAria:'Your cards',langAria:'Change language',
    rulesTitle:'Rules',rulesClose:'Got it',
    rulesHtml:`<li>4 players, two teams of two. <b>You + Partner (top seat)</b> vs the two opponents.</li>
    <li>Bidding starts after you see your first 5 cards. Bids: <b>No call</b>, <b>Small 7</b>, <b>Big 8</b>, <b>Bonus 10</b>.</li>
    <li>Bidding starts at the dealer's right and goes counterclockwise. Each bid must be higher than the one before.</li>
    <li>If everyone says no call, the cards are dealt again.</li>
    <li>The highest bidder picks the <b>trump suit</b>. Then the rest of the cards are dealt, 13 each.</li>
    <li>You must follow the lead suit. If you can't, you may play any card, including trump.</li>
    <li>The highest card of the lead suit wins, unless a trump is played. Then the highest trump wins. Ace is high.</li>
    <li>The bidding team needs its target (7/8/10 tricks): <b>+target</b> if made, <b>-target</b> if not.</li>
    <li>The other team's target is always <b>4 tricks</b>: +4 if made, -4 if not.</li>
    <li>First team to reach <b>29 points</b> wins.</li>`,
    first:function(){return 'First to '+TARGET_SCORE+' wins'},
    trump:'Trump',
    bidBy:function(t,b){return t+' bid '+b},
    saidBid:function(s){return NAMES[s]+' bid'},
    bidding:'Bidding',
    tricksUs:'Us tricks',tricksThem:'Them tricks',
    yourBid:'Your bid. Look at your 5 cards first.',
    thinking:function(s){return NAMES[s]+' is thinking...'},
    bidSaid:function(s,v){return NAMES[s]+': '+(v?(BIDNAME[v]+' '+v):'No call')},
    allPass:'Everyone passed. Dealing again...',
    youBid:function(b){return 'You bid '+b+'. Pick the trump suit.'},
    asTrump:function(n){return n+' as trump'},
    botBid:function(s,b,t){return NAMES[s]+' bid '+b+'. Trump '+SYM[t]},
    restDealt:function(t){return 'Trump '+SYM[t]+'. The rest of the cards are dealt.'},
    yourTurn:function(l){return 'Your turn. Follow '+SYM[l]},
    yourLead:'Your lead. Play any card.',
    playing:function(s){return NAMES[s]+' is playing...'},
    wonTrick:function(s){return NAMES[s]+' won the trick'},
    weWon:'We won!',
    weWonSub:function(n){return 'You and your partner reached '+n+' first.'},
    theyWon:'They won',
    theyWonSub:function(n){return 'The opponents reached '+n+' first.'},
    madeBid:function(t){return t+' made the bid'},
    missedBid:function(t){return t+' missed the bid'},
    bidSub:function(t,b,k){return t+' bid '+b+' and took '+k+' tricks.'},
    th1:'Tricks',th2:'This deal',th3:'Total',
    newGame:'New game',nextDeal:'Next deal',
    intro:function(n){return 'You and your partner (top seat) are one team against two opponents. First team to '+n+' points wins.'},
    start:'Start playing'
  }
};
function tr(k){
  var v=T[LANG][k];
  if(typeof v==='function')return v.apply(null,[].slice.call(arguments,1));
  return v;
}
var lastMsg=null;

var TH={14:1.4,13:1.0,12:0.7,11:0.5,10:0.3};
var SH={14:0.9,13:0.4,12:0.15};
var BID_T={7:3.2,8:4.0,10:4.8};

var S={
  dealer:3, scores:[0,0], phase:'idle',
  hands:[[],[],[],[]], deck:[],
  order:[], bidIdx:0, high:null, bidLog:[],
  trump:null, caller:null, bid:0,
  trick:[], leader:0, turn:0, tricks:[0,0],
  played:{}, gameOver:false, timer:null
};

var $=function(id){return document.getElementById(id)};
function team(seat){return seat%2}
function next(seat){return (seat+3)%4}   // ulto dike (right side)
function partner(seat){return (seat+2)%4}
function isRed(s){return s==='H'||s==='D'}
function rl(r){return RANKL[r]||String(r)}

function later(fn,ms){
  clearTimeout(S.timer);
  S.timer=setTimeout(fn,ms);
}

/* ---------- deck ---------- */
function newDeck(){
  var d=[];
  SUITS.forEach(function(s){for(var r=2;r<=14;r++)d.push({s:s,r:r,id:s+r})});
  for(var i=d.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=d[i];d[i]=d[j];d[j]=t;
  }
  return d;
}
function sortHand(h){
  var order=SUITS.slice();
  if(S.trump){order=[S.trump].concat(SUITS.filter(function(x){return x!==S.trump}))}
  h.sort(function(a,b){
    if(a.s!==b.s)return order.indexOf(a.s)-order.indexOf(b.s);
    return b.r-a.r;
  });
}

/* ---------- rendering ---------- */
var PIPS={
  2:[[50,14],[50,86]],
  3:[[50,14],[50,50],[50,86]],
  4:[[28,14],[72,14],[28,86],[72,86]],
  5:[[28,14],[72,14],[50,50],[28,86],[72,86]],
  6:[[28,14],[72,14],[28,50],[72,50],[28,86],[72,86]],
  7:[[28,14],[72,14],[50,32],[28,50],[72,50],[28,86],[72,86]],
  8:[[28,14],[72,14],[50,32],[28,50],[72,50],[50,68],[28,86],[72,86]],
  9:[[28,14],[72,14],[28,38],[72,38],[50,50],[28,62],[72,62],[28,86],[72,86]],
  10:[[28,14],[72,14],[50,26],[28,38],[72,38],[28,62],[72,62],[50,74],[28,86],[72,86]]
};
function cardFace(c){
  var r=rl(c.r),s=SYM[c.s];
  var t=r==='10'?' ten':'';
  var h='<div class="idx'+t+' tl"><b>'+r+'</b><i>'+s+'</i></div>'+
        '<div class="idx'+t+' br"><b>'+r+'</b><i>'+s+'</i></div>';
  if(c.r===14){
    h+='<div class="face"><span class="pip ace" style="left:50%;top:50%">'+s+'</span></div>';
  }else if(c.r>=11){
    h+='<div class="face"><div class="court"><i class="a">'+s+'</i><b>'+r+'</b><i class="z">'+s+'</i></div></div>';
  }else{
    h+='<div class="face">';
    PIPS[c.r].forEach(function(p){
      h+='<span class="pip'+(p[1]>50?' flip':'')+'" style="left:'+p[0]+'%;top:'+p[1]+'%">'+s+'</span>';
    });
    h+='</div>';
  }
  return h;
}
function cardEl(c,cls){
  var d=document.createElement('div');
  d.className='card'+(isRed(c.s)?' red':'')+(cls?' '+cls:'');
  d.setAttribute('role','img');
  d.setAttribute('aria-label',rl(c.r)+' of '+SUITNAME[c.s]);
  d.innerHTML=cardFace(c);
  return d;
}

function legalCards(seat){
  var h=S.hands[seat];
  if(S.trick.length===0)return h.slice();
  var lead=S.trick[0].card.s;
  var f=h.filter(function(c){return c.s===lead});
  return f.length?f:h.slice();
}

function renderHand(){
  var wrap=$('hand');
  wrap.innerHTML='';
  var h=S.hands[0];
  var myTurn=(S.phase==='play'&&S.turn===0&&S.trick.length<4);
  var legal=myTurn?legalCards(0):[];
  var legalIds={};legal.forEach(function(c){legalIds[c.id]=1});
  var per=h.length>7?Math.ceil(h.length/2):h.length;
  var rows=[h.slice(0,per),h.slice(per)];
  rows.forEach(function(row){
    if(!row.length)return;
    var rd=document.createElement('div');rd.className='hrow';
    row.forEach(function(c){
      var el=cardEl(c);
      if(myTurn){
        if(legalIds[c.id]){
          el.classList.add('legal');
          el.setAttribute('role','button');
          el.tabIndex=0;
          el.addEventListener('click',function(){humanPlay(c)});
          el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();humanPlay(c)}});
        }else el.classList.add('dim');
      }
      rd.appendChild(el);
    });
    wrap.appendChild(rd);
  });
}

function renderSeats(){
  [1,2,3].forEach(function(s){
    $('backs'+s).textContent=S.hands[s].length;
    var seat=$('seat'+s);
    var active=(S.phase==='play'&&S.turn===s&&S.trick.length<4)||(S.phase==='bid'&&S.order[S.bidIdx]===s);
    seat.classList.toggle('active',!!active);
    var nm=seat.querySelector('.name');
    nm.innerHTML=NAMES[s]+(S.dealer===s?'<i title="Dealer">D</i>':'');
  });
}

function renderTrick(winSeat){
  [0,1,2,3].forEach(function(s){$('slot'+s).innerHTML=''});
  S.trick.forEach(function(p){
    var el=cardEl(p.card,winSeat===p.seat?'win':'');
    $('slot'+p.seat).appendChild(el);
  });
}

function renderScores(){
  $('sUs').textContent=S.scores[0];
  $('sThem').textContent=S.scores[1];
}

function renderBidInfo(){
  var el=$('bidInfo');
  if(S.phase==='play'||S.phase==='trump'){
    var ct=team(S.caller);
    var who=ct===0?tr('us'):tr('them');
    var line='<span>'+tr('bidBy',who,S.bid)+'</span>';
    el.innerHTML=S.trump?'<strong>'+tr('trump')+' '+SYM[S.trump]+'</strong>'+line:line;
  }else if(S.phase==='bid'){
    el.innerHTML=S.high
      ?'<strong>'+BIDNAME[S.high.value]+' '+S.high.value+'</strong><span>'+tr('saidBid',S.high.seat)+'</span>'
      :'<span>'+tr('bidding')+'</span>';
  }else{
    el.innerHTML='<span>'+tr('first')+'</span>';
  }
}

function renderTally(){
  var t=$('tally');
  if(S.phase!=='play'){t.innerHTML='';return}
  var ct=team(S.caller);
  var tUs=ct===0?S.bid:4, tThem=ct===1?S.bid:4;
  t.innerHTML='<span>'+tr('tricksUs')+' <b>'+S.tricks[0]+'</b>/'+tUs+'</span><span>'+tr('tricksThem')+' <b>'+S.tricks[1]+'</b>/'+tThem+'</span>';
}

function paintMsg(){
  var m=$('msg');
  if(!lastMsg){m.textContent='';m.classList.remove('alert');return}
  m.textContent=tr.apply(null,[lastMsg.k].concat(lastMsg.a));
  m.classList.toggle('alert',lastMsg.alert);
}
function setMsg(k,args,alert){
  lastMsg=k?{k:k,a:args||[],alert:!!alert}:null;
  paintMsg();
}
function clearActs(){$('acts').innerHTML=''}

function renderAll(){
  renderScores();renderBidInfo();renderSeats();renderTrick();renderTally();renderHand();
}

/* ---------- hand evaluation (bots) ---------- */
function evalHand(h,trump){
  var x=0;
  h.forEach(function(c){
    if(c.s===trump)x+=0.55+(TH[c.r]||0);
    else x+=(SH[c.r]||0);
  });
  return x;
}
function bestTrump(h){
  var best=null,bv=-1;
  SUITS.forEach(function(s){
    var v=evalHand(h,s)+Math.random()*0.05;
    if(v>bv){bv=v;best=s}
  });
  return {suit:best,val:bv};
}

/* ---------- flow: deal ---------- */
function startDeal(){
  clearTimeout(S.timer);
  S.deck=newDeck();
  S.hands=[[],[],[],[]];
  for(var i=0;i<5;i++)for(var p=0;p<4;p++)S.hands[p].push(S.deck.pop());
  S.hands.forEach(sortHand);
  S.trump=null;S.caller=null;S.bid=0;S.high=null;S.trick=[];
  S.tricks=[0,0];S.played={};
  S.order=[];
  var s=next(S.dealer);
  for(var k=0;k<4;k++){S.order.push(s);s=next(s)}
  S.bidIdx=0;
  S.phase='bid';
  clearActs();
  renderAll();
  $('overlay').hidden=true;
  runBid();
}

/* ---------- flow: bidding ---------- */
function runBid(){
  if(S.bidIdx>=4){finishBid();return}
  var seat=S.order[S.bidIdx];
  renderSeats();renderBidInfo();
  if(seat===0){
    setMsg('yourBid');
    showBidButtons();
  }else{
    clearActs();
    setMsg('thinking',[seat]);
    later(function(){botBid(seat)},900);
  }
}

function showBidButtons(){
  var a=$('acts');a.innerHTML='';
  var hv=S.high?S.high.value:0;
  [0,7,8,10].forEach(function(v){
    var b=document.createElement('button');
    b.className='btn'+(v===0?'':' primary');
    b.textContent=v===0?'No call':BIDNAME[v]+' '+v;
    if(v!==0&&v<=hv)b.disabled=true;
    b.addEventListener('click',function(){humanBid(v)});
    a.appendChild(b);
  });
}

function humanBid(v){
  if(S.phase!=='bid'||S.order[S.bidIdx]!==0)return;
  clearActs();
  recordBid(0,v);
}

function botBid(seat){
  if(S.phase!=='bid'||S.order[S.bidIdx]!==seat)return;
  var h=S.hands[seat];
  var est=bestTrump(h).val+(Math.random()*0.7-0.35);
  var want=0;
  if(est>=BID_T[10])want=10;
  else if(est>=BID_T[8])want=8;
  else if(est>=BID_T[7])want=7;
  var hv=S.high?S.high.value:0;
  if(want&&want<=hv)want=0;
  if(S.high&&S.high.seat===partner(seat))want=0;
  recordBid(seat,want);
}

function recordBid(seat,v){
  if(v>0)S.high={seat:seat,value:v};
  setMsg('bidSaid',[seat,v]);
  S.bidIdx++;
  renderBidInfo();
  later(runBid,v?1100:700);
}

function finishBid(){
  if(!S.high){
    setMsg('allPass',[],true);
    later(startDeal,1600);
    return;
  }
  S.caller=S.high.seat;S.bid=S.high.value;
  S.phase='trump';
  renderBidInfo();renderSeats();
  if(S.caller===0){
    setMsg('youBid',[S.bid],true);
    var a=$('acts');a.innerHTML='';
    SUITS.forEach(function(s){
      var b=document.createElement('button');
      b.className='btn suit'+(isRed(s)?' red':'');
      b.textContent=SYM[s];
      b.setAttribute('aria-label',tr('asTrump',SUITNAME[s]));
      b.addEventListener('click',function(){chooseTrump(s)});
      a.appendChild(b);
    });
  }else{
    var t=bestTrump(S.hands[S.caller]).suit;
    setMsg('botBid',[S.caller,S.bid,t],true);
    later(function(){chooseTrump(t)},1500);
  }
}

function chooseTrump(s){
  if(S.phase!=='trump')return;
  S.trump=s;
  clearActs();
  for(var round=0;round<2;round++){
    for(var p=0;p<4;p++)for(var i=0;i<4;i++)S.hands[p].push(S.deck.pop());
  }
  S.hands.forEach(sortHand);
  S.phase='play';
  S.leader=next(S.dealer);
  S.turn=S.leader;
  S.trick=[];
  renderAll();
  setMsg('restDealt',[s]);
  later(runTurn,900);
}

/* ---------- flow: play ---------- */
function runTurn(){
  if(S.phase!=='play')return;
  renderSeats();renderHand();
  if(S.turn===0){
    var lead=S.trick.length?S.trick[0].card.s:null;
    if(lead)setMsg('yourTurn',[lead],true);else setMsg('yourLead',[],true);
  }else{
    setMsg('playing',[S.turn]);
    var seat=S.turn;
    later(function(){botPlay(seat)},750);
  }
}

function humanPlay(c){
  if(S.phase!=='play'||S.turn!==0||S.trick.length>=4)return;
  var ok=legalCards(0).some(function(x){return x.id===c.id});
  if(!ok)return;
  playCard(0,c);
}

function playCard(seat,card){
  var h=S.hands[seat];
  for(var i=0;i<h.length;i++){if(h[i].id===card.id){h.splice(i,1);break}}
  S.trick.push({seat:seat,card:card});
  S.played[card.id]=1;
  renderTrick();renderSeats();renderHand();
  if(S.trick.length===4){
    setMsg(null);
    renderSeats();
    later(resolveTrick,1000);
  }else{
    S.turn=next(seat);
    later(runTurn,seat===0?450:250);
  }
}

function beats(a,b){ // a card b-ke harabe?
  if(a.s===b.s)return a.r>b.r;
  if(a.s===S.trump&&b.s!==S.trump)return true;
  return false;
}
function currentWinner(){
  var best=S.trick[0];
  for(var i=1;i<S.trick.length;i++){
    if(beats(S.trick[i].card,best.card))best=S.trick[i];
  }
  return best;
}

function resolveTrick(){
  var w=currentWinner();
  S.tricks[team(w.seat)]++;
  renderTrick(w.seat);
  renderTally();
  setMsg('wonTrick',[w.seat],true);
  later(function(){
    S.trick=[];
    S.leader=w.seat;S.turn=w.seat;
    renderTrick();
    if(S.hands.every(function(h){return h.length===0})){endDeal();return}
    runTurn();
  },1100);
}

/* ---------- bot play ---------- */
function higherOutstanding(card,seat){
  for(var r=card.r+1;r<=14;r++){
    var id=card.s+r;
    if(S.played[id])continue;
    var mine=S.hands[seat].some(function(c){return c.id===id});
    if(!mine)return true;
  }
  return false;
}
function unseenTrumps(seat){
  var n=13,s=S.trump;
  Object.keys(S.played).forEach(function(id){if(id.charAt(0)===s)n--});
  S.hands[seat].forEach(function(c){if(c.s===s)n--});
  return n;
}
function key(c){return (c.s===S.trump?100:0)+c.r}
function lowest(arr){return arr.slice().sort(function(a,b){return key(a)-key(b)})[0]}
function highest(arr){return arr.slice().sort(function(a,b){return key(b)-key(a)})[0]}

function botPlay(seat){
  if(S.phase!=='play'||S.turn!==seat)return;
  var hand=S.hands[seat];
  var legal=legalCards(seat);
  var card;
  if(S.trick.length===0)card=botLead(seat,hand);
  else card=botFollow(seat,hand,legal);
  if(!card||!legal.some(function(c){return c.id===card.id}))card=lowest(legal);
  playCard(seat,card);
}

function botLead(seat,hand){
  var isCaller=team(seat)===team(S.caller);
  var trumps=hand.filter(function(c){return c.s===S.trump});
  if(isCaller&&trumps.length){
    var top=highest(trumps);
    if(!higherOutstanding(top,seat)&&unseenTrumps(seat)>0)return top;
  }
  var masters=hand.filter(function(c){return c.s!==S.trump&&!higherOutstanding(c,seat)});
  if(masters.length)return highest(masters);
  if(isCaller&&trumps.length>=3&&unseenTrumps(seat)>0)return highest(trumps);
  var side=hand.filter(function(c){return c.s!==S.trump});
  if(side.length){
    var counts={};
    side.forEach(function(c){counts[c.s]=(counts[c.s]||0)+1});
    var bestS=null;
    Object.keys(counts).forEach(function(s){if(bestS===null||counts[s]>counts[bestS])bestS=s});
    return lowest(side.filter(function(c){return c.s===bestS}));
  }
  return lowest(hand);
}

function botFollow(seat,hand,legal){
  var lead=S.trick[0].card.s;
  var win=currentWinner();
  var last=S.trick.length===3;
  var partnerWinning=win.seat===partner(seat);
  var canFollow=hand.some(function(c){return c.s===lead});
  var secure=last||!higherOutstanding(win.card,seat);
  if(canFollow){
    if(partnerWinning)return lowest(legal);
    var w=legal.filter(function(c){return beats(c,win.card)});
    if(w.length){
      if(last)return lowest(w);
      var m=w.filter(function(c){return !higherOutstanding(c,seat)});
      if(m.length)return lowest(m);
      return highest(w);
    }
    return lowest(legal);
  }
  var trumps=hand.filter(function(c){return c.s===S.trump});
  var side=hand.filter(function(c){return c.s!==S.trump});
  if(partnerWinning&&secure){
    return side.length?lowest(side):lowest(hand);
  }
  if(trumps.length){
    var tw=trumps.filter(function(c){return beats(c,win.card)});
    if(tw.length)return lowest(tw);
  }
  return side.length?lowest(side):lowest(hand);
}

/* ---------- end of deal ---------- */
function endDeal(){
  S.phase='result';
  var ct=team(S.caller),ot=1-ct;
  var made=S.tricks[ct]>=S.bid;
  var callerPts=made?S.bid:-S.bid;
  var oppPts=S.tricks[ot]>=4?4:-4;
  S.scores[ct]+=callerPts;
  S.scores[ot]+=oppPts;
  renderScores();renderTally();renderSeats();
  setMsg(null);clearActs();
  var winner=-1,a=S.scores[0],b=S.scores[1];
  if(a>=TARGET_SCORE||b>=TARGET_SCORE){
    if(a>b)winner=0;else if(b>a)winner=1;
  }
  S.gameOver=winner>=0;
  S.res={ct:ct,made:made,winner:winner,usPts:ct===0?callerPts:oppPts,themPts:ct===1?callerPts:oppPts};
  renderResult();
  later(function(){$('overlay').hidden=false;var nb=$('nextBtn');if(nb)nb.focus()},900);
}
function renderResult(){
  var r=S.res;if(!r)return;
  var title,sub;
  if(r.winner===0){title=tr('weWon');sub=tr('weWonSub',TARGET_SCORE)}
  else if(r.winner===1){title=tr('theyWon');sub=tr('theyWonSub',TARGET_SCORE)}
  else{
    var tm=r.ct===0?tr('we'):tr('they');
    title=r.made?tr('madeBid',tm):tr('missedBid',tm);
    sub=tr('bidSub',tm,S.bid,S.tricks[r.ct]);
  }
  function fmt(n){return '<span class="'+(n>=0?'pos':'neg')+'">'+(n>=0?'+':'')+n+'</span>'}
  $('sheet').innerHTML=
    '<h2>'+title+'</h2><p>'+sub+'</p>'+
    '<table><thead><tr><th></th><th>'+tr('th1')+'</th><th>'+tr('th2')+'</th><th>'+tr('th3')+'</th></tr></thead><tbody>'+
    '<tr><td>'+tr('us')+'</td><td class="num">'+S.tricks[0]+'</td><td class="num">'+fmt(r.usPts)+'</td><td class="num">'+S.scores[0]+'</td></tr>'+
    '<tr><td>'+tr('them')+'</td><td class="num">'+S.tricks[1]+'</td><td class="num">'+fmt(r.themPts)+'</td><td class="num">'+S.scores[1]+'</td></tr>'+
    '</tbody></table>'+
    '<button class="btn primary" id="nextBtn">'+tr(S.gameOver?'newGame':'nextDeal')+'</button>';
  $('nextBtn').addEventListener('click',function(){
    if(S.gameOver){S.scores=[0,0];S.gameOver=false}
    S.dealer=next(S.dealer);
    startDeal();
  });
}

/* ---------- start + rules ---------- */
function renderIntro(){
  $('sheet').innerHTML=
    '<h2>Call Game</h2>'+
    '<p>'+tr('intro',TARGET_SCORE)+'</p>'+
    '<button class="btn primary" id="startBtn">'+tr('start')+'</button>';
  $('startBtn').addEventListener('click',function(){S.dealer=3;startDeal()});
}

function applyLang(){
  NAMES[0]=tr('you');
  BIDNAME={7:tr('small'),8:tr('big'),10:tr('bonus')};
  document.documentElement.lang=LANG==='bn'?'bn':'en';
  $('lblUs').textContent=tr('us');
  $('lblThem').textContent=tr('them');
  $('rulesBtn').setAttribute('aria-label',tr('rulesAria'));
  $('hand').setAttribute('aria-label',tr('handAria'));
  $('langBtn').textContent=LANG==='bn'?'EN':'BN';
  $('langBtn').setAttribute('aria-label',tr('langAria'));
  $('rulesTitle').textContent=tr('rulesTitle');
  $('rulesList').innerHTML=tr('rulesHtml');
  $('rulesClose').textContent=tr('rulesClose');
  renderAll();
  paintMsg();
  if(S.phase==='bid'&&S.order[S.bidIdx]===0&&$('acts').children.length)showBidButtons();
  if(S.phase==='result')renderResult();
  if(S.phase==='idle')renderIntro();
}
$('langBtn').addEventListener('click',function(){
  LANG=LANG==='bn'?'en':'bn';
  try{localStorage.setItem('callgame-lang',LANG)}catch(e){}
  applyLang();
});

var dlg=$('rules');
$('rulesBtn').addEventListener('click',function(){
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
});
$('rulesClose').addEventListener('click',function(){
  if(dlg.close)dlg.close();else dlg.removeAttribute('open');
});

applyLang();
})();
</script>
