try{var _sv=localStorage.getItem('callgame-lang');if(_sv==='en'||_sv==='bn')LANG=_sv}catch(e){}

}
var T={
  bn:{
    you:'Tumi',us:'Amra',them:'Tara',we:'Amra',they:'Tara',
    small:'Choto call',big:'Boro call',bonus:'Bonus call',
    rulesAria:'Rules dekho',handAria:'Tomar card',langAria:'Language bodlao',homeAria:'Menu',handTitle:'Tomar card',

    rulesHtml:`<li>4 jon, 2 jon 2 jon team. <b>Tumi + Partner (uporer jon)</b> vs duijon Opponent.</li>

    <li><b>Online:</b> "Room banao" chaple ekta code pao. Friends ra code diye join kore. Faka seat e bot khelbe.</li>`,
    first:function(){return TARGET_SCORE+' point e jita'},

    },

    errNotFound:'Room paoa jay ni. Code ta check koro.',
    errFull:'Room full ba khela shuru hoye geche.',
    errGone:'Host er sathe connection kete geche.',
    errTimeout:'Connect hocche na. Same WiFi te try koro.',
    errCode:'4 okkhor er code likho.',
    leaveConfirm:'Khela cholche. Menu te jabe?',
    online:'Online',
    shareText:function(c){return 'Call Game e join koro. Room code: '+c}
  },
  en:{
    you:'You',us:'Us',them:'Them',we:'We',they:'They',
    small:'Small call',big:'Big call',bonus:'Bonus call',
    rulesAria:'Show rules',handAria:'Your cards',langAria:'Change language',homeAria:'Menu',handTitle:'Your cards',
    rulesTitle:'Rules',rulesClose:'Got it',
    rulesHtml:`<li>4 players, two teams of two. <b>You + Partner (top seat)</b> vs the two opponents.</li>
    <li>Bidding starts after you see your first 5 cards. Bids: <b>No call</b>, <b>Small 7</b>, <b>Big 8</b>, <b>Bonus 10</b>.</li>
    <li>Bidding starts at the dealer's right and goes counterclockwise. Each bid must be higher than the one before.</li>
    <li>If everyone says no call, the cards are dealt again.</li>
    <li>The highest bidder picks the <b>trump suit</b>. Then the rest of the cards are dealt, 13 each.</li>
    <li>You must follow the lead suit. If you can't, you may play any card, including trump.</li>
    <li>The highest card of the lead suit wins, unless a trump is played. Then the highest trump wins. Ace is high.</li>
    <li>The bidding team needs its target (7/8/10 tricks): <b>+target</b> if made, <b>-target</b> if not.</li>
    <li>The other team's target is always <b>4 tricks</b>: +4 if made, -4 if not.</li>
    <li>First team to reach <b>29 points</b> wins.</li>
    <li><b>Hidden trump mode:</b> the bidder keeps the trump suit secret and it has no power yet. The first time someone cannot follow suit, the trump is revealed and counts from then on.</li>
    <li><b>Online:</b> tap "Create room" to get a code. Friends join with the code. Empty seats are played by bots.</li>`,
    first:function(){return 'First to '+TARGET_SCORE+' wins'},
    trump:'Trump',
    partnerTag:'Partner',
    bidBy:function(t,b){return t+' bid '+b},
    saidBid:function(s){return nm(s)+' bid'},
    bidding:'Bidding',
    tricksUs:'Us tricks',tricksThem:'Them tricks',
    bidTurn:function(s){return s===V.seat?'Your bid. Look at your 5 cards first.':nm(s)+' is thinking...'},
    bidSaid:function(s,v){return nm(s)+': '+(v?(BIDNAME[v]+' '+v):'No call')},
    allPass:'Everyone passed. Dealing again...',
    trumpTurn:function(s,b){return s===V.seat?'You bid '+b+'. Pick the trump suit.':nm(s)+' bid '+b+'. Picking trump...'},
    asTrump:function(n){return n+' as trump'},
    restDealt:function(t){return 'Trump '+SYM[t]+'. The rest of the cards are dealt.'},
    playTurn:function(s){
      if(s===V.seat)return V.trick.length?'Your turn. Follow '+SYM[V.trick[0].card.s]:'Your lead. Play any card.';
      return nm(s)+' is playing...';
    },
    wonTrick:function(s){return nm(s)+' won the trick'},
    weWon:'We won!',
    weWonSub:function(n){return 'Your team reached '+n+' first.'},
    theyWon:'They won',
    theyWonSub:function(n){return 'The opponents reached '+n+' first.'},

    missedBid:function(t){return t+' missed the bid'},
    bidSub:function(t,b,k){return t+' bid '+b+' and took '+k+' tricks.'},
    th1:'Tricks',th2:'This deal',th3:'Total',
    newGame:'New game',nextDeal:'Next deal',
    tagline:'4 players \u00B7 2 vs 2 \u00B7 first to 29',friendsHead:'With friends',nameLbl:'Your name',
    restDealtHidden:'The trump suit is kept secret. The rest of the cards are dealt.',
    trumpRevealed:function(t,s){return nm(s)+' cannot follow suit. Trump is '+SYM[t]+'!'},
    modeLbl:'Game mode',modeNormal:'Standard',modeHidden:'Hidden trump',
    modeHintNormal:'The trump suit is announced to everyone.',
    modeHintHidden:'The trump suit stays secret. It is revealed when someone cannot follow suit.',

    codePh:'Code',joinRoom:'Join',
    roomTitle:'Your room',shareHint:'Send this code to your friends:',share:'Share',copied:'Copied',
    team1:'Team 1',team2:'Team 2',botName:'Bot',
    botNote:'Empty seats are played by bots.',startGame:'Start game',cancel:'Cancel',leave:'Leave',
    connecting:'Connecting...',waitHost:'Waiting for the host to start...',joinedRoom:'Room',
    errNoPeer:'Online play is not available here. Check your connection.',
    errNotFound:'Room not found. Check the code.',
    errFull:'The room is full or already started.',
    errGone:'Lost connection to the host.',
    errTimeout:'Could not connect. Try the same WiFi.',
    errCode:'Enter the 4-letter code.',
    leaveConfirm:'Game in progress. Go back to the menu?',
    online:'Online',
    shareText:function(c){return 'Join my Call Game. Room code: '+c}
  }
};
function tr(k){
  var v=T[LANG][k];
  if(typeof v==='function')return v.apply(null,[].slice.call(arguments,1));
  return v;
}

/* =====================================================
   Cards (shared by host engine + renderer)
   ===================================================== */
function newDeck(){
  var d=[];
  SUITS.forEach(function(s){for(var r=2;r<=14;r++)d.push({s:s,r:r,id:s+r})});
  for(var i=d.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=d[i];d[i]=d[j];d[j]=t;
  }
  return d;
}
function sortHand(h,trump){
  var order=SUITS.slice();
  if(trump){order=[trump].concat(SUITS.filter(function(x){return x!==trump}))}
  h.sort(function(a,b){
    if(a.s!==b.s)return order.indexOf(a.s)-order.indexOf(b.s);
    return b.r-a.r;
  });
}
var PIPS={
  2:[[50,14],[50,86]],
  3:[[50,14],[50,50],[50,86]],
  4:[[28,14],[72,14],[28,86],[72,86]],
  5:[[28,14],[72,14],[50,50],[28,86],[72,86]],
  6:[[28,14],[72,14],[28,50],[72,50],[28,86],[72,86]],
  7:[[28,14],[72,14],[50,32],[28,50],[72,50],[28,86],[72,86]],
  8:[[28,14],[72,14],[50,32],[28,50],[72,50],[50,68],[28,86],[72,86]],
  9:[[28,14],[72,14],[28,38],[72,38],[50,50],[28,62],[72,62],[28,86],[72,86]],
  10:[[28,14],[72,14],[50,26],[28,38],[72,38],[28,62],[72,62],[50,74],[28,86],[72,86]]
};
function cardFace(c){
  var r=rl(c.r),s=SYM[c.s];
  var t=r==='10'?' ten':'';
  var h='<div class="idx'+t+' tl"><b>'+r+'</b><i>'+s+'</i></div>'+
        '<div class="idx'+t+' br"><b>'+r+'</b><i>'+s+'</i></div>';
  if(c.r===14){
    h+='<div class="face"><span class="pip ace">'+s+'</span></div>';
  }else if(c.r>=11){
    h+='<div class="face"><div class="court"><i class="a">'+s+'</i><span class="wm">'+s+'</span><b>'+r+'</b><i class="z">'+s+'</i></div></div>';
  }else{
    h+='<div class="face">';
    PIPS[c.r].forEach(function(p){
      h+='<span class="pip'+(p[1]>50?' flip':'')+'" style="left:'+p[0]+'%;top:'+p[1]+'%">'+s+'</span>';
    });
    h+='</div>';
  }
  return h;
}


/* =====================================================
   HOST ENGINE (authoritative game state; runs on the host device)
   seats: 0..3, teams 0/2 vs 1/3, play goes counterclockwise
   ===================================================== */
var G=null;
var NET={mode:'none',peer:null,conn:null,code:'',err:'',connecting:false,lobbyNames:null,lobbyKinds:null,timeout:null};

function newG(){
  return {
    dealer:3,scores:[0,0],phase:'lobby',
    hands:[[],[],[],[]],deck:[],
    order:[],bidIdx:0,high:null,
    trump:null,caller:null,bid:0,
    trick:[],leader:0,turn:0,tricks:[0,0],
    played:{},res:null,gameOver:false,timer:null,
    msg:null,winSeat:-1,started:false,hidden:false,revealed:false,
    kinds:['host','bot','bot','bot'],
    names:['','Bot A','Bot B','Bot C'],
    conns:[null,null,null,null]
  };
}
function isHuman(s){return G.kinds[s]!=='bot'}
function later(fn,ms){
  if(!G)return;
  clearTimeout(G.timer);
  G.timer=setTimeout(fn,ms);
}

function effTrump(){return (G.hidden&&!G.revealed)?null:G.trump}
function trumpFor(seat){
  if(G.hidden&&!G.revealed&&seat!==G.caller)return null;
  return G.trump;
}
function viewFor(seat){
  var legal=null;
  if(G.phase==='play'&&G.turn===seat&&G.trick.length<4)legal=legalCards(seat).map(function(c){return c.id});
  return clone({
    seat:seat,phase:G.phase,dealer:G.dealer,scores:G.scores,names:G.names,
    bidTurn:G.phase==='bid'?G.order[G.bidIdx]:-1,
    high:G.high,caller:G.caller,bid:G.bid,trump:trumpFor(seat),hidden:G.hidden,revealed:G.revealed,
    trick:G.trick,turn:G.turn,tricks:G.tricks,
    counts:G.hands.map(function(h){return h.length}),
    hand:G.hands[seat],legal:legal,msg:G.msg,res:G.res,winSeat:G.winSeat
  });
}
function push(){
  if(!G||!G.started)return;
  for(var s=0;s<4;s++){
    if(G.kinds[s]==='host')applyView(viewFor(0));
    else if(G.kinds[s]==='remote'){
      var c=G.conns[s];
      try{if(c&&c.open)c.send({t:'view',v:viewFor(s)})}catch(e){}
    }
  }
}
function setMsg(k,args,alert){
  G.msg=k?{k:k,a:args||[],alert:!!alert}:null;
  push();
}

function legalCards(seat){
  var h=G.hands[seat];
  if(G.trick.length===0)return h.slice();
  var lead=G.trick[0].card.s;
  var f=h.filter(function(c){return c.s===lead});
  return f.length?f:h.slice();
}

function startGame(){
  G.started=true;
  G.scores=[0,0];G.dealer=3;G.gameOver=false;G.res=null;
  startDeal();
}
function startDeal(){
  if(!G)return;
  clearTimeout(G.timer);
  G.deck=newDeck();
  G.hands=[[],[],[],[]];
  for(var i=0;i<5;i++)for(var p=0;p<4;p++)G.hands[p].push(G.deck.pop());
  G.hands.forEach(function(h){sortHand(h,null)});
  G.trump=null;G.caller=null;G.bid=0;G.high=null;G.trick=[];
  G.tricks=[0,0];G.played={};G.res=null;G.winSeat=-1;G.revealed=false;
  G.order=[];
  var s=next(G.dealer);
  for(var k=0;k<4;k++){G.order.push(s);s=next(s)}
  G.bidIdx=0;
  G.phase='bid';
  runBid();
}

/* ---- bidding ---- */
function runBid(){
  if(!G)return;
  if(G.bidIdx>=4){finishBid();return}
  var seat=G.order[G.bidIdx];
  setMsg('bidTurn',[seat]);
  if(!isHuman(seat))later(function(){botBid(seat)},900);
}
function recordBid(seat,v){
  if(v>0)G.high={seat:seat,value:v};
  G.bidIdx++;
  setMsg('bidSaid',[seat,v]);
  later(runBid,v?1100:700);
}
function finishBid(){
  if(!G.high){
    setMsg('allPass',[],true);
    later(startDeal,1600);
    return;
  }
  G.caller=G.high.seat;G.bid=G.high.value;
  G.phase='trump';
  setMsg('trumpTurn',[G.caller,G.bid],true);
  if(!isHuman(G.caller)){
    var t=bestTrump(G.hands[G.caller]).suit;
    later(function(){chooseTrump(t)},1500);
  }
}
function chooseTrump(s){
  if(!G||G.phase!=='trump')return;
  G.trump=s;
  for(var round=0;round<2;round++){
    for(var p=0;p<4;p++)for(var i=0;i<4;i++)G.hands[p].push(G.deck.pop());
  }
  G.hands.forEach(function(h){sortHand(h,effTrump())});
  G.phase='play';
  G.leader=next(G.dealer);
  G.turn=G.leader;
  G.trick=[];
  if(G.hidden)setMsg('restDealtHidden',[]);else setMsg('restDealt',[s]);
  later(runTurn,900);
}

/* ---- play ---- */
function runTurn(){
  if(!G||G.phase!=='play')return;
  if(G.hidden&&!G.revealed&&G.trick.length>0){
    var lead=G.trick[0].card.s;
    if(!G.hands[G.turn].some(function(c){return c.s===lead})){
      G.revealed=true;
      G.hands.forEach(function(h){sortHand(h,G.trump)});
      setMsg('trumpRevealed',[G.trump,G.turn],true);
      later(takeTurn,1500);
      return;
    }
  }
  takeTurn();
}
function takeTurn(){
  if(!G||G.phase!=='play')return;
  setMsg('playTurn',[G.turn],isHuman(G.turn));
  if(!isHuman(G.turn)){
    var seat=G.turn;
    later(function(){botPlay(seat)},750);
  }
}
function playCard(seat,card){
  var h=G.hands[seat];
  for(var i=0;i<h.length;i++){if(h[i].id===card.id){h.splice(i,1);break}}
  G.trick.push({seat:seat,card:card});
  G.played[card.id]=1;
  if(G.trick.length===4){
    setMsg(null);
    later(resolveTrick,1000);
  }else{
    G.turn=next(seat);
    push();
    later(runTurn,isHuman(seat)?450:250);
  }
}
function beats(a,b){
  if(a.s===b.s)return a.r>b.r;
  var tr_=effTrump();
  if(tr_&&a.s===tr_&&b.s!==tr_)return true;
  return false;
}
function currentWinner(){
  var best=G.trick[0];
  for(var i=1;i<G.trick.length;i++){
    if(beats(G.trick[i].card,best.card))best=G.trick[i];
  }
  return best;
}
function resolveTrick(){
  if(!G)return;
  var w=currentWinner();
  G.tricks[team(w.seat)]++;
  G.winSeat=w.seat;
  setMsg('wonTrick',[w.seat],true);
  later(function(){
    G.trick=[];G.winSeat=-1;
    G.leader=w.seat;G.turn=w.seat;
    if(G.hands.every(function(h){return h.length===0})){endDeal();return}
    runTurn();
  },1100);
}
function endDeal(){
  var ct=team(G.caller),ot=1-ct;
  var made=G.tricks[ct]>=G.bid;
  var pts=[0,0];
  pts[ct]=made?G.bid:-G.bid;
  pts[ot]=G.tricks[ot]>=4?4:-4;
  G.scores[0]+=pts[0];G.scores[1]+=pts[1];
  var winner=-1,a=G.scores[0],b=G.scores[1];
  if(a>=TARGET_SCORE||b>=TARGET_SCORE){
    if(a>b)winner=0;else if(b>a)winner=1;
  }
  G.gameOver=winner>=0;
  G.res={ct:ct,bid:G.bid,made:made,winner:winner,pts:pts,tricks:G.tricks.slice()};
  G.phase='result';
  setMsg(null);
}
function nextAfterResult(){
  if(G.gameOver){G.scores=[0,0];G.gameOver=false}
  G.dealer=next(G.dealer);
  startDeal();
}

/* ---- actions from players (validated by the host) ---- */
function handleAction(seat,a){
  if(!G||!a)return;
  if(a.t==='bid'){
    if(G.phase!=='bid'||G.order[G.bidIdx]!==seat)return;
    var v=a.v;
    if(v!==0&&v!==7&&v!==8&&v!==10)return;
    var hv=G.high?G.high.value:0;
    if(v!==0&&v<=hv)return;
    recordBid(seat,v);
  }else if(a.t==='trump'){
    if(G.phase!=='trump'||G.caller!==seat)return;
    if(SUITS.indexOf(a.s)<0)return;
    chooseTrump(a.s);
  }else if(a.t==='play'){
    if(G.phase!=='play'||G.turn!==seat||G.trick.length>=4)return;
    var card=null;
    G.hands[seat].forEach(function(c){if(c.id===a.id)card=c});
    if(!card)return;
    var ok=legalCards(seat).some(function(c){return c.id===card.id});
    if(!ok)return;
    playCard(seat,card);
  }else if(a.t==='next'){
    if(G.phase!=='result')return;
    nextAfterResult();
  }
}

/* ---- bots ---- */
function evalHand(h,trump){
  var x=0;
  h.forEach(function(c){
    if(c.s===trump)x+=0.55+(TH[c.r]||0);
    else x+=(SH[c.r]||0);
  });
  return x;
}
function bestTrump(h){
  var best=null,bv=-1;
  SUITS.forEach(function(s){
    var v=evalHand(h,s)+Math.random()*0.05;
    if(v>bv){bv=v;best=s}
  });
  return {suit:best,val:bv};
}
function botBid(seat){
  if(!G||G.phase!=='bid'||G.order[G.bidIdx]!==seat)return;
  var h=G.hands[seat];
  var est=bestTrump(h).val+(Math.random()*0.7-0.35);
  var want=0;
  if(est>=BID_T[10])want=10;
  else if(est>=BID_T[8])want=8;
  else if(est>=BID_T[7])want=7;
  var hv=G.high?G.high.value:0;
  if(want&&want<=hv)want=0;
  if(G.high&&G.high.seat===partner(seat))want=0;
  recordBid(seat,want);
}
function higherOutstanding(card,seat){
  for(var r=card.r+1;r<=14;r++){
    var id=card.s+r;
    if(G.played[id])continue;
    var mine=G.hands[seat].some(function(c){return c.id===id});
    if(!mine)return true;
  }
  return false;
}
var BT=null;
function knownTrump(seat){
  if(!G.hidden||G.revealed||seat===G.caller)return G.trump;
  return null;
}
function unseenTrumps(seat){
  if(!BT)return 0;
  var n=13,s=BT;
  Object.keys(G.played).forEach(function(id){if(id.charAt(0)===s)n--});
  G.hands[seat].forEach(function(c){if(c.s===s)n--});
  return n;
}
function key(c){return (c.s===BT?100:0)+c.r}
function lowest(arr){return arr.slice().sort(function(a,b){return key(a)-key(b)})[0]}
function highest(arr){return arr.slice().sort(function(a,b){return key(b)-key(a)})[0]}
function botPlay(seat){
  if(!G||G.phase!=='play'||G.turn!==seat)return;
  BT=knownTrump(seat);
  var hand=G.hands[seat];
  var legal=legalCards(seat);
  var card;
  if(G.trick.length===0)card=botLead(seat,hand);
  else card=botFollow(seat,hand,legal);
  if(!card||!legal.some(function(c){return c.id===card.id}))card=lowest(legal);
  playCard(seat,card);
}
function botLead(seat,hand){
  var isCaller=team(seat)===team(G.caller);
  var trumps=hand.filter(function(c){return c.s===BT});
  if(isCaller&&trumps.length){
    var top=highest(trumps);
    if(!higherOutstanding(top,seat)&&unseenTrumps(seat)>0)return top;
  }
  var masters=hand.filter(function(c){return c.s!==BT&&!higherOutstanding(c,seat)});
  if(masters.length)return highest(masters);
  if(isCaller&&trumps.length>=3&&unseenTrumps(seat)>0)return highest(trumps);
  var side=hand.filter(function(c){return c.s!==BT});
  if(side.length){
    var counts={};
    side.forEach(function(c){counts[c.s]=(counts[c.s]||0)+1});
    var bestS=null;
    Object.keys(counts).forEach(function(s){if(bestS===null||counts[s]>counts[bestS])bestS=s});
    return lowest(side.filter(function(c){return c.s===bestS}));
  }
  return lowest(hand);
}
function botFollow(seat,hand,legal){
  var lead=G.trick[0].card.s;
  var win=currentWinner();
  var last=G.trick.length===3;
  var partnerWinning=win.seat===partner(seat);
  var canFollow=hand.some(function(c){return c.s===lead});
  var secure=last||!higherOutstanding(win.card,seat);
  if(canFollow){
    if(partnerWinning)return lowest(legal);
    var w=legal.filter(function(c){return beats(c,win.card)});
    if(w.length){
      if(last)return lowest(w);
      var m=w.filter(function(c){return !higherOutstanding(c,seat)});
      if(m.length)return lowest(m);
      return highest(w);
    }
    return lowest(legal);
  }
  var trumps=hand.filter(function(c){return c.s===BT});
  var side=hand.filter(function(c){return c.s!==BT});
  if(partnerWinning&&secure){
    return side.length?lowest(side):lowest(hand);
  }
  if(trumps.length){
    var tw=trumps.filter(function(c){return beats(c,win.card)});
    if(tw.length)return lowest(tw);
  }
  return side.length?lowest(side):lowest(hand);
}

function teardown(msgKey){
  clearTimeout(NET.timeout);
  if(G){clearTimeout(G.timer);
    if(NET.mode==='host'){for(var s=0;s<4;s++){var c=G.conns[s];try{if(c&&c.open)c.send({t:'bye'})}catch(e){}}}
  }
  try{if(NET.conn)NET.conn.close()}catch(e){}

function createRoom(){

  G=newG();G.names[0]=name;G.hidden=HIDDEN_MODE;
  NET.mode='host';NET.err='';L='connecting';renderOverlay();
  openHostPeer(0);
}
function openHostPeer(attempt){
  var code=makeCode();
  var peer;
  try{peer=new Peer(PEER_PREFIX+code,PEER_OPTS)}catch(e){teardown('errNoPeer');return}
  NET.peer=peer;NET.code=code;
  clearTimeout(NET.timeout);
  NET.timeout=setTimeout(function(){if(L==='connecting')teardown('errTimeout')},15000);
  peer.on('open',function(){
    clearTimeout(NET.timeout);
    L='hostlobby';renderOverlay();
  });
  peer.on('connection',onHostConn);
  peer.on('error',function(e){
    if(e&&e.type==='unavailable-id'&&attempt<5){try{peer.destroy()}catch(x){};openHostPeer(attempt+1);return}
    if(L==='connecting')teardown('errNoPeer');
  });
}
function lobbySnapshot(){
  return {names:G.names.slice(),kinds:G.kinds.slice()};
}
function broadcastLobby(){
  var snap=lobbySnapshot();
  for(var s=0;s<4;s++){
    if(G.kinds[s]==='remote'){
      var c=G.conns[s];
      try{if(c&&c.open)c.send({t:'lobby',names:snap.names,kinds:snap.kinds,seat:s,code:NET.code,hidden:G.hidden})}catch(e){}
    }
  }
  renderOverlay();
}
function onHostConn(conn){
  conn.on('data',function(m){
    if(!G||!m)return;
    if(m.t==='hello'){
      if(G.started){try{conn.send({t:'full'})}catch(e){};setTimeout(function(){try{conn.close()}catch(e){}},300);return}
      var free=[2,1,3].filter(function(s){return G.kinds[s]==='bot'})[0];
      if(free===undefined){try{conn.send({t:'full'})}catch(e){};setTimeout(function(){try{conn.close()}catch(e){}},300);return}
      G.kinds[free]='remote';
      G.names[free]=String(m.name||'Player').slice(0,14);
      G.conns[free]=conn;
      conn.__seat=free;
      try{conn.send({t:'welcome',seat:free,code:NET.code})}catch(e){}
      broadcastLobby();
    }else if(m.t==='act'){
      if(conn.__seat===undefined)return;
      handleAction(conn.__seat,m.a);
    }
  });
  function gone(){
    if(!G||conn.__seat===undefined)return;
    var s=conn.__seat;
    if(G.conns[s]!==conn)return;
    G.conns[s]=null;G.kinds[s]='bot';
    G.names[s]=['','Bot A','Bot B','Bot C'][s];
    conn.__seat=undefined;
    if(!G.started){broadcastLobby();return}
    push();
    if(G.phase==='bid'&&G.order[G.bidIdx]===s)runBid();
    else if(G.phase==='trump'&&G.caller===s)finishBid();
    else if(G.phase==='play'&&G.turn===s&&G.trick.length<4)runTurn();
  }
  conn.on('close',gone);
  conn.on('error',gone);
}
function hostStart(){
  if(!G||G.started)return;
  L='game';
  startGame();
}

function joinRoom(){
  var name=myName();
  var code=($('codeIn').value||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)){NET.err='errCode';renderOverlay();return}
  if(typeof Peer==='undefined'){NET.err='errNoPeer';renderOverlay();return}
  NET.mode='client';NET.err='';NET.code=code;L='connecting';renderOverlay();
  var peer;
  try{peer=new Peer(PEER_OPTS)}catch(e){teardown('errNoPeer');return}
  NET.peer=peer;
  NET.timeout=setTimeout(function(){if(L==='connecting')teardown('errTimeout')},15000);
  peer.on('error',function(e){
    if(L!=='connecting'&&L!=='clientlobby'&&L!=='game')return;
    if(e&&e.type==='peer-unavailable')teardown('errNotFound');
    else if(L==='connecting')teardown('errNoPeer');
  });
  peer.on('open',function(){
    var conn=peer.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'});
    NET.conn=conn;
    conn.on('open',function(){try{conn.send({t:'hello',name:name})}catch(e){}});
    conn.on('data',onClientMsg);
    conn.on('close',function(){if(NET.mode==='client'&&NET.conn===conn)teardown('errGone')});
  });
}
function onClientMsg(m){
  if(!m)return;
  if(m.t==='welcome'||m.t==='lobby'){
    clearTimeout(NET.timeout);
    if(L==='connecting'||L==='clientlobby'){
      L='clientlobby';
      if(m.names){NET.lobbyNames=m.names;NET.lobbyKinds=m.kinds}
      NET.lobbyHidden=!!m.hidden;
      NET.mySeat=m.seat;
      renderOverlay();
    }
  }else if(m.t==='view'){
    clearTimeout(NET.timeout);
    L='game';
    applyView(m.v);
  }else if(m.t==='full'){
    teardown('errFull');
  }else if(m.t==='bye'){
    teardown('errGone');
  }
}
function act(a){
  if(NET.mode==='host'){handleAction(0,a)}
  else if(NET.mode==='client'&&NET.conn&&NET.conn.open){
    try{NET.conn.send({t:'act',a:a})}catch(e){}
  }
}

function flyIn(f){
  var el=f.el,r=rel(f.seat);
  var end=el.getBoundingClientRect();
  var start=null,flip=false,sideways=false;
  if(r===0){
    var src=document.querySelector('#hand .card[data-id="'+f.id+'"]');
    if(src)start=src.getBoundingClientRect();
  }else{
    var fan=document.querySelector('#seat'+r+' .fan');
    var kids=fan?fan.children:[];
    var last=kids.length?kids[kids.length-1]:fan;
    if(last){start=last.getBoundingClientRect();flip=true;sideways=(r!==2)}
  }
  if(!start||!end.width||!start.width)return;
  var dx=(start.left+start.width/2)-(end.left+end.width/2);
  var dy=(start.top+start.height/2)-(end.top+end.height/2);
  var s=sideways?start.width/end.height:start.width/end.width;
  s=Math.max(.3,Math.min(1.3,s));
  var rot=sideways?(r===1?' rotate(90deg)':' rotate(-90deg)'):'';
  var fromT='translate('+dx+'px,'+dy+'px) scale('+s+')'+rot+(flip?' perspective(500px) rotateY(70deg)':'');
  var toT='translate(0px,0px) scale(1)'+(sideways?' rotate(0deg)':'')+(flip?' perspective(500px) rotateY(0deg)':'');
  el.animate([{transform:fromT,opacity:flip?.5:1},{transform:toT,opacity:1}],
    {duration:flip?430:360,easing:'cubic-bezier(.2,.8,.25,1)'});
}

  var old=document.querySelectorAll('#trick .slot .card');
  if(CAN_ANIM&&V&&V.trick.length===0&&old.length===4&&PREV&&PREV.winSeat>=0)sweepTrick(old,PREV.winSeat);
  if(!V){[0,1,2,3].forEach(function(r){$('slot'+r).innerHTML=''});return}
  var fresh=[];
  V.trick.forEach(function(p){
    var slot=$('slot'+rel(p.seat));
    var el=slot.querySelector('.card[data-id="'+p.card.id+'"]');
    if(!el){
      slot.innerHTML='';
      el=cardEl(p.card);
      slot.appendChild(el);
      fresh.push({el:el,seat:p.seat,id:p.card.id});
    }
    el.classList.toggle('win',V.winSeat===p.seat);
  });
  [0,1,2,3].forEach(function(r){
    var has=V.trick.some(function(p){return rel(p.seat)===r});
    if(!has)$('slot'+r).innerHTML='';
  });
  if(CAN_ANIM)fresh.forEach(flyIn);
}
function flashTrump(){
  var el=$('bidInfo');
  el.animate([{transform:'scale(1.14)',borderColor:'#f1d58f',offset:0},{transform:'scale(1)',offset:1}],{duration:700,easing:'ease-out'});
}
function popScore(el,old,nw){
  var d=nw-old,sc=el.parentNode;
  var p=document.createElement('span');
  p.className='pop '+(d>=0?'pos':'neg');
  p.textContent=(d>=0?'+':'')+d;
  sc.appendChild(p);
  setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},1300);
  var t0=null,dur=650;
  function step(ts){
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=k<1?Math.round(old+(nw-old)*e):nw;
    if(k<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  el.animate([{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:450,easing:'ease-out'});
}
function renderScores(){
  $('lblUs').textContent=tr('us');
  $('lblThem').textContent=tr('them');
  if(!V){$('sUs').textContent=0;$('sThem').textContent=0;shownScores=null;return}
  var vals=[V.scores[myTeam()],V.scores[1-myTeam()]];
  if(V.phase==='result'&&shownScores)return;   // the result sheet shows the new totals; the board animates when the next deal starts
  if(!shownScores){
    $('sUs').textContent=vals[0];$('sThem').textContent=vals[1];
    shownScores=vals.slice();return;
  }
  ['sUs','sThem'].forEach(function(id,i){
    var old=shownScores[i],nw=vals[i];
    if(old===nw)return;
    var reset=(vals[0]===0&&vals[1]===0);
    if(CAN_ANIM&&!reset)popScore($(id),old,nw);else $(id).textContent=nw;
    shownScores[i]=nw;
  });
}
function confetti(){
  if(!CAN_ANIM)return;
  var layer=$('fx'),colors=['#f1d58f','#d6b35f','#f0e8d4','#e07b78','#a5dcab'];
  var W=window.innerWidth||360,H=window.innerHeight||640;
  for(var i=0;i<46;i++){
    var p=document.createElement('i');
    p.className='cf';
    var size=6+Math.random()*6;
    p.style.cssText='left:'+(Math.random()*W)+'px;top:-16px;width:'+size+'px;height:'+(size*1.6)+'px;background:'+colors[i%colors.length]+';';
    layer.appendChild(p);
    var drift=(Math.random()-.5)*180,spin=Math.random()*720-360;
    var a=p.animate([{transform:'translate(0px,0px) rotate(0deg)',opacity:1},
      {transform:'translate('+drift+'px,'+(H*.7+Math.random()*H*.3)+'px) rotate('+spin+'deg)',opacity:.85}],
      {duration:1800+Math.random()*1400,delay:Math.random()*500,easing:'cubic-bezier(.3,.1,.6,1)',fill:'both'});
    a.onfinish=(function(node){return function(){if(node.parentNode)node.parentNode.removeChild(node)}})(p);
  }
}
var ICO='<svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5z"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14c3 0 5 1.8 5 4.5h-4.2c-.1-1.8-.5-3.2-.8-4.5z"/></svg>';
function renderBidInfo(){
  var el=$('bidInfo');
  var txt;
  if(V&&(V.phase==='play'||V.phase==='trump'||V.phase==='result')&&V.caller!==null){
    var who=team(V.caller)===myTeam()?tr('us'):tr('them');
    txt=tr('bidBy',who,V.bid);
    if(V.hidden&&!V.revealed)txt=tr('trump')+' '+(V.trump?SYM[V.trump]:'?')+' \u00B7 '+txt;
    else if(V.trump)txt=tr('trump')+' '+SYM[V.trump]+' \u00B7 '+txt;
  }else if(V&&V.phase==='bid'){
    txt=V.high?(BIDNAME[V.high.value]+' '+V.high.value+' \u00B7 '+tr('saidBid',V.high.seat)):tr('bidding');
  }else{
    txt=tr('first');
  }
  el.innerHTML=ICO+'<span></span>';
  el.lastChild.textContent=txt;
}
function renderTally(){
  var t=$('tally');
  if(!V||V.phase!=='play'){t.innerHTML='';return}
  var mt=myTeam(),ct=team(V.caller);
  var tUs=ct===mt?V.bid:4,tThem=ct===mt?4:V.bid;
  t.innerHTML='<span>'+tr('tricksUs')+' <b>'+V.tricks[mt]+'</b>/'+tUs+'</span><span>'+tr('tricksThem')+' <b>'+V.tricks[1-mt]+'</b>/'+tThem+'</span>';
}
function paintMsg(){
  var m=$('msg');
  if(!V||!V.msg){m.textContent='';m.classList.remove('alert');return}
  m.textContent=tr.apply(null,[V.msg.k].concat(V.msg.a));
  m.classList.toggle('alert',!!V.msg.alert);
}
function renderActs(){
  var a=$('acts');
  var mode='';
  if(V&&V.phase==='bid'&&V.bidTurn===V.seat)mode='bid';
  else if(V&&V.phase==='trump'&&V.caller===V.seat)mode='trump';
  $('dock').classList.toggle('has-acts',mode!=='');
  var k=mode+'|'+(V&&V.high?V.high.value:0)+'|'+LANG;
  if(k===actsKey)return;
  actsKey=k;
  a.innerHTML='';
  if(mode==='bid'){
    var hv=V.high?V.high.value:0;
    [0,7,8,10].forEach(function(v){
      var b=document.createElement('button');
      b.className='btn'+(v===0?'':' primary');
      b.textContent=v===0?'No call':BIDNAME[v]+' '+v;
      if(v!==0&&v<=hv)b.disabled=true;
      b.addEventListener('click',function(){a.innerHTML='';actsKey='sent';act({t:'bid',v:v})});
      a.appendChild(b);
    });
  }else if(mode==='trump'){
    SUITS.forEach(function(s){
      var b=document.createElement('button');
      b.className='btn suit'+(isRed(s)?' red':'');
      b.textContent=SYM[s];
      b.setAttribute('aria-label',tr('asTrump',SUITNAME[s]));
      b.addEventListener('click',function(){a.innerHTML='';actsKey='sent';act({t:'trump',s:s})});
      a.appendChild(b);
    });
  }
}
function renderAll(){
  renderScores();renderBidInfo();renderSeats();renderTrick();renderTally();renderHand();paintMsg();renderActs();
}

/* ---- overlay: menu, lobby, result ---- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function teamsList(names,kinds){
  function n(i){return kinds[i]==='bot'?tr('botName'):esc(names[i])}
  return '<ul class="teams"><li><b>'+tr('team1')+'</b> '+n(0)+' + '+n(2)+'</li><li><b>'+tr('team2')+'</b> '+n(1)+' + '+n(3)+'</li></ul>';
}
function renderOverlay(){
  var ov=$('overlay'),sheet=$('sheet');
  if(L==='game'){
    ov.classList.remove('full');
    sheet.className='sheet';
    if(V&&V.phase==='result'&&resultVisible){
      renderResultSheet();ov.hidden=false;
      if(!confettiShown&&V.res&&V.res.winner===myTeam()){confettiShown=true;confetti()}
    }
    else ov.hidden=true;
    return;
  }
  ov.hidden=false;
  ov.classList.add('full');
  sheet.className='sheet'+(L==='menu'?' menu':'');
  if(L==='menu'){
    var saved='';try{saved=localStorage.getItem('callgame-name')||''}catch(e){}
    var hash=(location.hash||'').replace('#','').toUpperCase();
    var prefill=/^[A-Z0-9]{4}$/.test(hash)?hash:'';
    var keep=$('codeIn')?$('codeIn').value:prefill;
    var keepName=$('nameIn')?$('nameIn').value:saved;
    sheet.innerHTML=
      '<div class="suits" aria-hidden="true"><i>&#9824;&#xFE0E;</i><i class="r">&#9829;&#xFE0E;</i><i class="r">&#9830;&#xFE0E;</i><i>&#9827;&#xFE0E;</i></div>'+
      '<div class="brand"><h1>Call Game</h1><p>'+tr('tagline')+'</p></div>'+
      '<div class="stack">'+
      '<div><label class="lbl2" for="nameIn">'+tr('nameLbl')+'</label><input id="nameIn" class="field" maxlength="14" autocomplete="nickname" placeholder="'+esc(tr('namePh'))+'"></div>'+
      '<div><span class="lbl2">'+tr('modeLbl')+'</span><div class="modes" role="group" aria-label="'+esc(tr('modeLbl'))+'">'+
        '<button type="button" class="chip" data-m="0">'+tr('modeNormal')+'</button>'+
        '<button type="button" class="chip" data-m="1">'+tr('modeHidden')+'</button></div>'+
        '<p class="hint" id="modeHint"></p></div>'+
      '<button id="soloBtn" class="btn primary big" type="button">'+tr('playBots')+'</button>'+
      '<div class="divider">'+tr('friendsHead')+'</div>'+
      '<button id="mkBtn" class="btn big" type="button">'+tr('createRoom')+'</button>'+
      '<div class="row"><input id="codeIn" class="field code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="'+esc(tr('codePh'))+'"><button id="joinBtn" class="btn primary" type="button">'+tr('joinRoom')+'</button></div>'+
      '<p class="err" id="errP"></p></div>';
    $('nameIn').value=keepName;
    $('codeIn').value=keep||prefill;
    $('errP').textContent=NET.err?tr(NET.err):'';
    var chips=sheet.querySelectorAll('.chip');
    function paintChips(){
      Array.prototype.forEach.call(chips,function(ch){
        var on=(ch.getAttribute('data-m')==='1')===HIDDEN_MODE;
        ch.classList.toggle('on',on);
        ch.setAttribute('aria-pressed',on?'true':'false');
      });
      $('modeHint').textContent=tr(HIDDEN_MODE?'modeHintHidden':'modeHintNormal');
    }
    Array.prototype.forEach.call(chips,function(ch){
      ch.addEventListener('click',function(){
        HIDDEN_MODE=ch.getAttribute('data-m')==='1';
        try{localStorage.setItem('callgame-hidden',HIDDEN_MODE?'1':'0')}catch(e){}
        paintChips();
      });
    });
    paintChips();
    $('soloBtn').addEventListener('click',startSolo);
    $('mkBtn').addEventListener('click',createRoom);
    $('joinBtn').addEventListener('click',joinRoom);
  }else if(L==='connecting'){
    sheet.innerHTML='<h2>'+tr('online')+'</h2><p>'+tr('connecting')+'</p><button id="cancelBtn" class="btn" type="button">'+tr('cancel')+'</button>';
    $('cancelBtn').addEventListener('click',function(){teardown('')});
  }else if(L==='hostlobby'){
    sheet.innerHTML=
      '<h2>'+tr('roomTitle')+'</h2><p>'+tr('shareHint')+'</p>'+
      '<div class="codebox"><div class="codebig" id="codeBig"></div></div>'+
      '<button id="shareBtn" class="btn" type="button">'+tr('share')+'</button>'+
      teamsList(G.names,G.kinds)+
      '<p class="modeline">'+tr('modeLbl')+': <b>'+tr(G.hidden?'modeHidden':'modeNormal')+'</b></p>'+
      '<p>'+tr('botNote')+'</p>'+
      '<div class="stack"><button id="startBtn" class="btn primary" type="button">'+tr('startGame')+'</button>'+
      '<button id="cancelBtn" class="btn" type="button">'+tr('cancel')+'</button></div>';
    $('codeBig').textContent=NET.code;
    $('startBtn').addEventListener('click',hostStart);
    $('cancelBtn').addEventListener('click',function(){teardown('')});
    $('shareBtn').addEventListener('click',function(){
      var url=location.href.split('#')[0]+'#'+NET.code;
      var text=tr('shareText',NET.code);
      var btn=$('shareBtn');
      if(navigator.share){navigator.share({text:text,url:url}).catch(function(){})}
      else if(navigator.clipboard){navigator.clipboard.writeText(text+' '+url).then(function(){btn.textContent=tr('copied')}).catch(function(){})}
    });
  }else if(L==='clientlobby'){
    sheet.innerHTML=
      '<h2>'+tr('joinedRoom')+' '+esc(NET.code)+'</h2>'+
      (NET.lobbyNames?teamsList(NET.lobbyNames,NET.lobbyKinds):'')+
      '<p class="modeline">'+tr('modeLbl')+': <b>'+tr(NET.lobbyHidden?'modeHidden':'modeNormal')+'</b></p>'+
      '<p>'+tr('waitHost')+'</p>'+
      '<button id="cancelBtn" class="btn" type="button">'+tr('leave')+'</button>';
    $('cancelBtn').addEventListener('click',function(){teardown('')});
  }
}
function renderResultSheet(){
  var r=V.res;if(!r)return;
  var mt=myTeam(),ot=1-mt;
  var title,sub;
  if(r.winner===mt){title=tr('weWon');sub=tr('weWonSub',TARGET_SCORE)}
  else if(r.winner===ot){title=tr('theyWon');sub=tr('theyWonSub',TARGET_SCORE)}
  else{
    var tm=r.ct===mt?tr('we'):tr('they');
    title=r.made?tr('madeBid',tm):tr('missedBid',tm);
    sub=tr('bidSub',tm,r.bid,r.tricks[r.ct]);
  }
  function fmt(n){return '<span class="'+(n>=0?'pos':'neg')+'">'+(n>=0?'+':'')+n+'</span>'}
  $('sheet').innerHTML=
    '<h2>'+title+'</h2><p>'+sub+'</p>'+
    '<table><thead><tr><th></th><th>'+tr('th1')+'</th><th>'+tr('th2')+'</th><th>'+tr('th3')+'</th></tr></thead><tbody>'+
    '<tr><td>'+tr('us')+'</td><td class="num">'+r.tricks[mt]+'</td><td class="num">'+fmt(r.pts[mt])+'</td><td class="num">'+V.scores[mt]+'</td></tr>'+
    '<tr><td>'+tr('them')+'</td><td class="num">'+r.tricks[ot]+'</td><td class="num">'+fmt(r.pts[ot])+'</td><td class="num">'+V.scores[ot]+'</td></tr>'+
    '</tbody></table>'+
    '<button class="btn primary" id="nextBtn" type="button">'+tr(r.winner>=0?'newGame':'nextDeal')+'</button>';
  $('nextBtn').addEventListener('click',function(){act({t:'next'})});
  $('nextBtn').focus();
}

/* =====================================================
   Language, rules, menu button
   ===================================================== */
function applyLang(){
  BIDNAME={7:tr('small'),8:tr('big'),10:tr('bonus')};
  document.documentElement.lang=LANG==='bn'?'bn':'en';
  $('rulesBtn').setAttribute('aria-label',tr('rulesAria'));
  $('hand').setAttribute('aria-label',tr('handAria'));
  $('langBtn').textContent=LANG==='bn'?'EN':'BN';
  $('langBtn').setAttribute('aria-label',tr('langAria'));
  $('homeBtn').setAttribute('aria-label',tr('homeAria'));
  $('handTitle').textContent=tr('handTitle');
  $('rulesTitle').textContent=tr('rulesTitle');
  $('rulesList').innerHTML=tr('rulesHtml');
  $('rulesClose').textContent=tr('rulesClose');
  renderAll();renderOverlay();
}
$('langBtn').addEventListener('click',function(){
  LANG=LANG==='bn'?'en':'bn';
  try{localStorage.setItem('callgame-lang',LANG)}catch(e){}
  applyLang();
});
$('homeBtn').addEventListener('click',function(){
  if(L==='game'||L==='hostlobby'||L==='clientlobby'){
    if(L==='game'&&!window.confirm(tr('leaveConfirm')))return;
    teardown('');
  }else if(L==='connecting'){teardown('')}
});
var dlg=$('rules');
$('rulesBtn').addEventListener('click',function(){
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
});
$('rulesClose').addEventListener('click',function(){
  if(dlg.close)dlg.close();else dlg.removeAttribute('open');
});

applyLang();
})();
